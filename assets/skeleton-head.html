<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="__DESCRIPTION__">
<title>__TITLE__</title>
<style>
:root{
  --bg:#FAF7F0; --surface:#FFFFFF; --dark:#1A1816;
  --line:#E8E0CC; --text:#1A1816; --muted:#6B6660;
  --accent:#CC6A3D; --accent-soft:#F4E3D7; --accent-ink:#94441F;
  --accent2:#3B6B5A; --accent2-soft:#DCE8E2;
  --radius:10px; --radius-lg:16px;
  --shadow-sm:0 1px 2px rgba(26,24,22,.04);
  --shadow-md:0 4px 12px rgba(26,24,22,.06);
  --container:1120px; --measure:760px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:64px;background:var(--bg)}
body{
  background:var(--bg);color:var(--text);font-size:16px;line-height:1.75;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
code:not(pre code){padding:.1em .35em;border-radius:4px;background:var(--accent-soft);
  color:#9C4E28;font-size:.9em;overflow-wrap:anywhere}
a{color:var(--accent-ink)}
.container{max-width:var(--container);margin:0 auto;padding:0 28px}
.measure{max-width:var(--measure)}

.page-head{padding:64px 0 40px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.tag{padding:5px 11px;border-radius:100px;font-size:12px;font-weight:600;
  background:var(--accent-soft);color:var(--accent-ink);overflow-wrap:anywhere}
.tag.neutral{background:#EFE9DA;color:var(--muted)}
h1{font-size:clamp(30px,5vw,46px);line-height:1.16;font-weight:800;letter-spacing:-.02em;overflow-wrap:break-word}
.page-sub{margin-top:18px;font-size:18px;color:var(--muted);max-width:var(--measure);overflow-wrap:break-word}
.page-meta{display:flex;flex-wrap:wrap;gap:16px;margin-top:24px;font-size:13px;color:var(--muted)}
.page-meta span{overflow-wrap:anywhere}

.keypoint{margin-top:40px;background:var(--dark);color:#F5F1E8;
  border-radius:var(--radius-lg);padding:32px 36px;box-shadow:var(--shadow-md)}
.keypoint-label{font-size:12px;font-weight:700;letter-spacing:.1em;
  color:#E0995F;margin-bottom:14px}
.keypoint p{font-size:18px;line-height:1.75;overflow-wrap:break-word}
.keypoint p+p{margin-top:12px}
.keypoint b{color:#F7B98C;font-weight:600}
.keypoint a{color:var(--accent)}

.nav{position:sticky;top:0;z-index:50;margin-top:56px;
  background:rgba(250,247,240,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.nav-inner{display:flex;gap:4px;max-width:var(--container);margin:0 auto;
  padding:0 28px;overflow-x:auto;scrollbar-width:thin}
.nav a{flex:0 0 auto;padding:14px 12px;color:var(--muted);text-decoration:none;
  font-size:13px;font-weight:600;border-bottom:2px solid transparent}
.nav a:hover{color:var(--text)}
.nav a.on{color:var(--accent-ink);border-bottom-color:var(--accent)}

.section{padding:64px 0;border-bottom:1px solid var(--line)}
.section:last-of-type{border-bottom:none}
.section-num{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--accent-ink)}
.section h2{margin-top:10px;font-size:clamp(22px,3vw,30px);line-height:1.3;
  font-weight:800;letter-spacing:-.01em;max-width:var(--measure);overflow-wrap:break-word}
.section h3{margin-top:28px;font-size:18px;font-weight:700;line-height:1.4;overflow-wrap:break-word}
.section-lead{margin-top:14px;font-size:16px;color:var(--muted);max-width:var(--measure);overflow-wrap:break-word}
.section p{margin-top:16px;max-width:var(--measure);overflow-wrap:break-word}
.section ul,.section ol{margin:16px 0 0 20px;max-width:var(--measure)}
.section li{margin-top:8px;overflow-wrap:break-word}

@media (max-width:880px){
  .container,.nav-inner{padding:0 18px}
  .page-head{padding:40px 0 28px}
  .keypoint{padding:24px 22px}
  .keypoint p{font-size:16px}
  .section{padding:44px 0}
}
.grid{display:grid;gap:14px;margin-top:24px}
.grid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.concept{background:var(--surface);border:1px solid var(--line);
  border-left:4px solid var(--accent);border-radius:var(--radius);padding:18px 20px;min-width:0}
/* 假设 .grid 内只放同类卡片；非同类混搭会破坏奇偶交替效果 */
.concept:nth-child(2n){border-left-color:var(--accent2)}
.concept h3{margin:0;font-size:16px;font-weight:700;line-height:1.4}
.concept .term{margin-top:3px;font-size:12px;color:var(--muted);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:break-word}
.concept p{margin-top:9px;max-width:none;font-size:14.5px;color:#55524C}
.concept .analogy{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line);
  font-size:14px;color:var(--muted);overflow-wrap:break-word}

.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:24px}
.metric{background:var(--surface);border:1px solid var(--line);
  border-top:3px solid var(--accent);border-radius:var(--radius);
  padding:16px 14px;text-align:center;min-width:0}
.metric-value{font-size:24px;font-weight:800;color:var(--accent);line-height:1.2;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}
.metric-label{margin-top:6px;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.metric-note{margin-top:5px;font-size:12px;color:var(--muted);line-height:1.5;overflow-wrap:break-word}

.panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:24px}
.panel{background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:20px 22px;min-width:0}
.panel-title{display:flex;align-items:center;gap:8px;font-size:15px;
  font-weight:700;margin-bottom:6px;overflow-wrap:anywhere}
.panel-title .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.panel.good .panel-title{color:var(--accent2)}
.panel.bad .panel-title{color:var(--accent-ink)}
.panel ul{margin:0;list-style:none}
.panel li{margin:0;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.panel li:last-child{border-bottom:none}

.note{margin-top:20px;padding:14px 18px;border-left:3px solid var(--accent2);
  background:var(--accent2-soft);border-radius:6px;font-size:14.5px;
  max-width:var(--measure);overflow-wrap:break-word}
.note.warn{border-left-color:var(--accent);background:var(--accent-soft)}

.code-cap{margin-top:22px;font-size:12.5px;font-weight:600;color:var(--muted);overflow-wrap:break-word}
pre{margin-top:8px;padding:18px 20px;background:var(--dark);color:#E8E2D6;
  border-radius:var(--radius);overflow-x:auto;font-size:13px;line-height:1.7}
pre code{padding:0;background:none;color:inherit;font-size:inherit}

.formula{margin-top:16px;padding:14px 18px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:13.5px;line-height:1.9;overflow-x:auto}

.takeaway{margin-top:24px;padding:26px 30px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius-lg)}
.takeaway ul{margin:0;list-style:none}
.takeaway li{position:relative;margin:0;padding:12px 0 12px 28px;
  border-bottom:1px solid var(--line)}
.takeaway li:last-child{border-bottom:none}
.takeaway li::before{content:"";position:absolute;left:0;top:20px;
  width:12px;height:12px;border-radius:3px;
  background:var(--accent-soft);border:2px solid var(--accent)}

@media (max-width:880px){
  .grid.c2,.grid.c3,.panels{grid-template-columns:1fr}
  .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .takeaway{padding:20px 18px}
}
.expand{margin-top:14px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);overflow:hidden}
.expand-head{display:flex;align-items:flex-start;gap:14px;padding:18px 20px;cursor:pointer}
.expand-head:hover{background:#FBF8F1}
.expand-head:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
.expand-num{flex:0 0 auto;width:26px;height:26px;border-radius:7px;
  background:var(--accent-soft);color:var(--accent-ink);font-size:12px;font-weight:800;
  display:grid;place-items:center}
.expand-title{font-size:16px;font-weight:700;line-height:1.4;overflow-wrap:anywhere}
.expand-summary{margin-top:4px;font-size:13.5px;color:var(--muted);line-height:1.6;overflow-wrap:anywhere}
.expand-caret{margin-left:auto;flex:0 0 auto;color:var(--muted);font-size:13px;
  transition:transform .2s}
.expand.on .expand-caret{transform:rotate(90deg)}
.expand-body{max-height:0;opacity:0;overflow:hidden;
  transition:max-height .3s ease,opacity .25s ease}
.expand.on .expand-body{max-height:2400px;opacity:1}
.expand-body-inner{padding:16px 20px 20px;border-top:1px solid var(--line)}
.expand-body-inner p{margin-top:0;max-width:none;overflow-wrap:break-word}
.expand-body-inner p+p{margin-top:12px}

.flow{margin-top:24px;padding:22px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius-lg)}
.flow-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.btn{padding:8px 16px;border:none;border-radius:7px;font-family:inherit;
  font-size:13px;font-weight:600;cursor:pointer}
.btn-primary{background:var(--accent-ink);color:#fff}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.flow-progress{margin-left:auto;font-size:12.5px;color:var(--muted);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.flow-stage{display:grid;gap:12px}
.flow-node{padding:14px 16px;background:#FBF8F1;border:1px solid var(--line);
  border-radius:var(--radius);opacity:.45;
  transition:opacity .25s,border-color .25s,background .25s}
.flow-node.on{opacity:1;border-color:var(--accent);background:var(--accent-soft)}
.flow-node.done{opacity:1;border-color:var(--accent2);background:var(--accent2-soft)}
.flow-node-title{font-size:14.5px;font-weight:700;overflow-wrap:anywhere}
.flow-node-desc{margin-top:4px;font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.flow-caption{margin-top:16px;padding:14px 16px;background:var(--dark);
  color:#E8E2D6;border-radius:var(--radius);font-size:14px;line-height:1.7;overflow-wrap:break-word}

figure{margin-top:24px}
figure img{display:block;width:100%;height:auto;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius)}
.fig-scroll{overflow-x:auto}
.fig-scroll img{width:auto;max-width:none}
.fig-cap{margin-top:10px;font-size:13.5px;color:var(--muted);max-width:var(--measure);overflow-wrap:break-word}
.fig-toggle{display:inline-block;margin-top:8px;font-size:13px;font-weight:600;
  color:var(--accent-ink);cursor:pointer;user-select:none}
.fig-toggle:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
.fig-detail{max-height:0;opacity:0;overflow:hidden;
  transition:max-height .3s ease,opacity .25s ease}
figure.on .fig-detail{max-height:1600px;opacity:1}
.fig-detail-inner{margin-top:12px;padding:16px 18px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);font-size:14.5px;overflow-wrap:break-word}
.fig-detail-inner ul{margin:0;padding-left:18px}
.fig-detail-inner li{margin-top:10px}
.fig-detail-inner li:first-child{margin-top:0}
/* == 组件层追加位置 == */
</style>
</head>
<body>
